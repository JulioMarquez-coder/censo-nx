<!-- Tabla de todos los estados -->
<h2 class="text-xl font-bold mt-10 mb-4 p-1 text-center">Tabla completa de estados</h2>

<!--Buscador -->
<div class="flex justify-center mb-3">
  <div class="w-full max-w-xl px-3">
    <input
      type="text"
      [(ngModel)]="busqueda"
      placeholder="Escribe un estado"
      class="w-full rounded-lg border border-gray-300 px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <div class="text-sm text-gray-600 mt-2 text-center">
      Mostrando:
      <span class="font-semibold">{{ estadosFiltradosOrdenados.length }}</span>
    </div>
  </div>
</div>

<div
  class="max-h-96 overflow-y-auto overflow-x-auto rounded-xl border border-gray-300 shadow-md bg-white m-3 mx-60 [scrollbar-gutter:stable]"
>
  <table class="w-full border-separate border-spacing-0 text-sm">
    <thead class="odd:bg-white even:bg-gray-50 hover:bg-blue-50 transition-colors">
      <tr>
        <th
          class="px-4 py-3 text-left sticky top-0 z-30 bg-gray-200 border-b-2 border-gray-400 uppercase tracking-wide text-xs font-semibold"
        >
          Estado
        </th>
        <th
          class="px-4 py-3 text-right sticky top-0 z-30 bg-gray-200 border-b-2 border-gray-400 uppercase tracking-wide text-xs font-semibold"
        >
          Población
        </th>
      </tr>
    </thead>

    <tbody>
      @for (e of estadosFiltradosOrdenados; track e.name) {
        <tr class="odd:bg-white even:bg-gray-100 hover:bg-gray-200">
          <td class="border border-gray-400 px-3 py-2">
            {{ e.name }}
          </td>
          <td class="border border-gray-400 px-3 py-2 text-right">
            {{ e.population | number: '1.0-0' }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<div class="flex flex-wrap justify-center gap-2 mb-4 p-2">
  <button
    (click)="cambiarOrden('alfabetico-asc')"
    class="px-3 py-1 rounded text-white transition-all"
    [ngClass]="
      ordenActual === 'alfabetico-asc'
        ? 'bg-green-400 text-black'
        : 'bg-red-600 hover:bg-gray-500'
    "
  >
    A–Z
  </button>

  <button
    (click)="cambiarOrden('alfabetico-desc')"
    class="px-3 py-1 rounded text-white transition-all"
    [ngClass]="
      ordenActual === 'alfabetico-desc'
        ? 'bg-green-400 text-black'
        : 'bg-red-600 hover:bg-gray-500'
    "
  >
    Z–A
  </button>

  <button
    (click)="cambiarOrden('poblacion-desc')"
    class="px-3 py-1 rounded text-white transition-all"
    [ngClass]="
      ordenActual === 'poblacion-desc'
        ? 'bg-green-400 text-black'
        : 'bg-red-600 hover:bg-gray-500'
    "
  >
    Mayor a menor
  </button>

  <button
    (click)="cambiarOrden('poblacion-asc')"
    class="px-3 py-1 rounded text-white transition-all"
    [ngClass]="
      ordenActual === 'poblacion-asc'
        ? 'bg-green-400 text-black'
        : 'bg-red-600 hover:bg-gray-500'
    "
  >
    Menor a mayor
  </button>
</div>
